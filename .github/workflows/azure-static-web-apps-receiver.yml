name: Deploy Receiver App to Azure Static Web Apps

on:
  push:
    branches:
      - main
    paths:
      - "docproc/src/client/receiver-app/**"
      - ".github/workflows/azure-static-web-apps-receiver.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths:
      - "docproc/src/client/receiver-app/**"
      - ".github/workflows/azure-static-web-apps-receiver.yml"
  workflow_dispatch:

env:
  NODE_VERSION: "22.x"
  APP_LOCATION: "docproc/src/client/receiver-app"
  OUTPUT_LOCATION: "dist/receiver-app/browser"

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Generate config.json
        env:
          API_URL: ${{ secrets.RECEIVER_API_URL }}
          APP_ENV: production
          LOG_LEVEL: info
          ENABLE_CONSOLE_LOGGING: true
        run: |
          cd docproc/src/client/receiver-app
          bash scripts/generate-config.sh
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WITTY_DESERT_0A4772003 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "./docproc/src/client/receiver-app/" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "dist/docproc-uploader" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WITTY_DESERT_0A4772003 }}
          app_location: "./docproc/src/client/receiver-app/" # Required by the action even for close
          action: "close"
